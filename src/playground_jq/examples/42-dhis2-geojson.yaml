    digest: 6b8b5f83c506ddb3a3362f700cf39447298fc7de934569e7ccdd3745be9ee9da

  - id: dhis2-geojson-geometry-field
    title: Geometry as a field of the metadata API
    level: 101
    tags: [geojson, metadata, geometry]
    explanation: |
      `/api/organisationUnits?fields=id,name,code,level,geometry` returns the same boundaries
      as a `geometry` field of ordinary org unit objects, not as a FeatureCollection. The
      geometry itself is a GeoJSON geometry object, identical to the one the `.geojson`
      endpoint returns, and `level` is a number here.
    program: '.organisationUnits[0] | {keys: keys, level, geometryType: .geometry.type, geometryKeys: (.geometry | keys)}'
    input: {ref: dhis2:org-units-geometry}
    manual: [https://jqlang.org/manual/v1.8/#keys-keys_unsorted]
    guide: [geojson-with-jq]
    expected: [{"keys": ["code", "geometry", "id", "level", "name"], "level": 2, "geometryType": "Polygon", "geometryKeys": ["coordinates", "type"]}]

  - id: dhis2-geojson-geometry-field-to-collection
    title: Wrap geometry fields into a FeatureCollection
    level: 201
    tags: [geojson, metadata, geometry]
    explanation: |
      Moving the `geometry` field into a Feature and the other fields into `properties` turns
      the metadata response into GeoJSON. This is the reshaping to use when the regular API is
      more convenient than the `.geojson` endpoint, for example to request other fields. The
      program builds the FeatureCollection and then summarises it, showing the first feature
      without its coordinates; drop the last step to get the full GeoJSON.
    program: '{type: "FeatureCollection", features: [.organisationUnits[] | {type: "Feature", id, geometry, properties: {name, code, level}}]} | {type, features: (.features | length), first: (.features[0] | {type, id, properties, geometryType: .geometry.type})}'
    input: {ref: dhis2:org-units-geometry}
    manual: [https://jqlang.org/manual/v1.8/#map-map_values]
    guide: [geojson-with-jq]
    expected: [{"type": "FeatureCollection", "features": 13, "first": {"type": "Feature", "id": "O6uvpzGd5pu", "properties": {"name": "Bo", "code": "OU_264", "level": 2}, "geometryType": "Polygon"}}]

  - id: dhis2-geojson-geofeature-co-string
    title: geoFeatures coordinates are a JSON string
    level: 101
    tags: [geofeatures, fromjson]
    explanation: |
      `/api/geoFeatures` is DHIS2's own map format: short keys (`na` name, `le` level, `pi`
      parent id, `pn` parent name, `pg` parent graph, `ty` type) and the coordinates in `co` as
      a JSON-encoded string. `fromjson` parses the string into the real nested array.
    program: '.data[0] | {na, le, pn, coType: (.co | type), co: (.co | .[:40]), parsedType: (.co | fromjson | type), positions: (.co | fromjson | length)}'
    input: {ref: dhis2:geo-features-facilities-bo}
    manual: [https://jqlang.org/manual/v1.8/]
    guide: [geojson-with-jq]
    expected: [{"na": "Baoma Station CHP", "le": 4, "pn": "Baoma", "coType": "string", "co": "[-11.4382,7.9294]", "parsedType": "array", "positions": 2}]

  - id: dhis2-geojson-geofeature-ty-trap
    title: The ty code does not tell Polygon from MultiPolygon
    level: 201
    tags: [geofeatures, fromjson, paths]
    explanation: |
      `ty` is 1 for points and 2 for polygons, and it is 2 for both Polygon and MultiPolygon.
      The nesting depth of the parsed coordinates tells them apart: the longest path is 1 for a
      Point, 3 for a Polygon and 4 for a MultiPolygon. Seven districts are Polygons and six are
      MultiPolygons, all with `ty` 2.
    program: '.data | map({na, ty, depth: ((.co | fromjson) | [paths | length] | max)}) | group_by([.ty, .depth]) | map({ty: .[0].ty, depth: .[0].depth, districts: map(.na)})'
    input: {ref: dhis2:geo-features-level-2}
    manual: [https://jqlang.org/manual/v1.8/#paths]
    guide: [geojson-with-jq, paths]
    expected: [[{"ty": 2, "depth": 3, "districts": ["Bo", "Bombali", "Kailahun", "Kenema", "Koinadugu", "Kono", "Tonkolili"]}, {"ty": 2, "depth": 4, "districts": ["Bonthe", "Kambia", "Moyamba", "Port Loko", "Pujehun", "Western Area"]}]]

  - id: dhis2-geojson-geofeatures-to-geojson
    title: Turn district geoFeatures into GeoJSON
    level: 301
    tags: [geofeatures, fromjson, geojson]
    explanation: |
      Each geoFeature becomes a Feature: parse `co`, derive the geometry type from the nesting
      depth (not from `ty`), and map the short keys to readable properties. The geometries are
      identical to those of `dhis2:org-units-geojson-level-2`, so the two endpoints draw the
      same map.
    program: '{type: "FeatureCollection", features: [.data[] | (.co | fromjson) as $c | ($c | [paths | length] | max) as $depth | {type: "Feature", id, properties: {name: .na, code, level: .le, parent: .pn}, geometry: {type: (if $depth == 1 then "Point" elif $depth == 3 then "Polygon" else "MultiPolygon" end), coordinates: $c}}]}'
    input: {ref: dhis2:geo-features-level-2}
    geojson: true
    manual: [https://jqlang.org/manual/v1.8/]
    guide: [geojson-with-jq]
    digest: 0f1184b1a8c86a82f723cc34dcb165b1ed1719ebf49542c51d731996c1ab24c8

  - id: dhis2-geojson-facility-geofeatures-to-geojson
    title: Turn facility geoFeatures into GeoJSON points
    level: 201
    tags: [geofeatures, fromjson, geojson]
    explanation: |
      For facilities every `co` parses to a `[lon, lat]` pair, so the geometry is always a
      Point. The chiefdom name `pn` comes along as a property, which the GeoJSON endpoint does
      not provide (it only has the parent id).
    program: '{type: "FeatureCollection", features: [.data[] | {type: "Feature", id, properties: {name: .na, chiefdom: .pn}, geometry: {type: "Point", coordinates: (.co | fromjson)}}]}'
    input: {ref: dhis2:geo-features-facilities-bo}
    geojson: true
    manual: [https://jqlang.org/manual/v1.8/]
    guide: [geojson-with-jq]
    digest: fd8720ac1b786e5c4067cbe97ec04fd7375d01ab1bec17c0680cae50083c941b

  - id: dhis2-geojson-geofeatures-per-chiefdom
    title: Facilities per chiefdom by parent name
    level: 101
    tags: [geofeatures, group_by]
    explanation: |
      Because geoFeatures carry the parent's name in `pn`, counting facilities per chiefdom
      needs no lookup. Kakua has 10 facilities with coordinates, although the org unit tree
      lists 40 children for it: most of its facilities have no location.
    program: '.data | group_by(.pn) | map({chiefdom: .[0].pn, facilities: length}) | sort_by(-.facilities, .chiefdom) | .[:5]'
    input: {ref: dhis2:geo-features-facilities-bo}
    manual: [https://jqlang.org/manual/v1.8/#group_by]
    guide: [geojson-with-jq, sorting-and-grouping]
    expected: [[{"chiefdom": "Kakua", "facilities": 10}, {"chiefdom": "Baoma", "facilities": 8}, {"chiefdom": "Lugbu", "facilities": 6}, {"chiefdom": "Jaiama Bongor", "facilities": 5}, {"chiefdom": "Bargbe", "facilities": 4}]]

  - id: dhis2-geojson-geofeature-flags
    title: The hcd and hcu flags
    level: 101
    tags: [geofeatures, group_by]
    explanation: |
      `hcd` (has coordinates down) says whether children of the unit have coordinates, and
      `hcu` (has coordinates up) whether its parent has. A map uses them to offer drilling down
      or up. All 13 districts can drill down but not up, because the country itself has no
      boundary. In `dhis2:geo-features-facilities-bo` it is the reverse: the facilities can go
      up to their chiefdom but have no children.
    program: '{level: .data[0].le, flags: (.data | map({hcd, hcu}) | group_by(.) | map(.[0] + {count: length}))}'
    input: {ref: dhis2:geo-features-level-2}
    manual: [https://jqlang.org/manual/v1.8/#group_by]
    guide: [geojson-with-jq]
    expected: [{"level": 2, "flags": [{"hcd": true, "hcu": false, "count": 13}]}]
