id: manual-basic-filters
title: 'jq manual: Basic filters'
description: 'Every runnable example from the ''Basic filters'' section of the jq 1.8 manual. Source: https://jqlang.org/manual/v1.8/#basic-filters
  (jq 1.8 manual (https://jqlang.org/manual/v1.8/), CC BY 3.0).'
order: 900
track: manual
examples:
- id: manual-identity-1
  title: 'Identity: . (1)'
  level: 101
  tags:
  - manual
  program: .
  input:
    text: '"Hello, world!"'
  expected:
  - Hello, world!
  manual:
  - https://jqlang.org/manual/v1.8/#identity
  attribution: jq 1.8 manual (https://jqlang.org/manual/v1.8/), CC BY 3.0
- id: manual-identity-2
  title: 'Identity: . (2)'
  level: 101
  tags:
  - manual
  program: .
  input:
    text: '0.12345678901234567890123456789'
  expected:
  - 0.12345678901234568
  manual:
  - https://jqlang.org/manual/v1.8/#identity
  attribution: jq 1.8 manual (https://jqlang.org/manual/v1.8/), CC BY 3.0
- id: manual-identity-3
  title: 'Identity: . (3)'
  level: 101
  tags:
  - manual
  program: '[., tojson] == if have_decnum then [12345678909876543212345,"12345678909876543212345"] else [12345678909876543000000,"12345678909876543000000"]
    end'
  input:
    text: '12345678909876543212345'
  expected:
  - true
  manual:
  - https://jqlang.org/manual/v1.8/#identity
  attribution: jq 1.8 manual (https://jqlang.org/manual/v1.8/), CC BY 3.0
- id: manual-identity-4
  title: 'Identity: . (4)'
  level: 101
  tags:
  - manual
  program: '[1234567890987654321,-1234567890987654321 | tojson] == if have_decnum then ["1234567890987654321","-1234567890987654321"]
    else ["1234567890987654400","-1234567890987654400"] end'
  input:
    text: 'null'
  expected:
  - true
  manual:
  - https://jqlang.org/manual/v1.8/#identity
  attribution: jq 1.8 manual (https://jqlang.org/manual/v1.8/), CC BY 3.0
- id: manual-identity-5
  title: 'Identity: . (5)'
  level: 101
  tags:
  - manual
  program: . < 0.12345678901234567890123456788
  input:
    text: '0.12345678901234567890123456789'
  expected:
  - false
  manual:
  - https://jqlang.org/manual/v1.8/#identity
  attribution: jq 1.8 manual (https://jqlang.org/manual/v1.8/), CC BY 3.0
- id: manual-identity-6
  title: 'Identity: . (6)'
  level: 101
  tags:
  - manual
  program: map([., . == 1]) | tojson == if have_decnum then "[[1,true],[1.000,true],[1.0,true],[1.00,true]]" else "[[1,true],[1,true],[1,true],[1,true]]"
    end
  input:
    text: '[1, 1.000, 1.0, 100e-2]'
  expected:
  - true
  manual:
  - https://jqlang.org/manual/v1.8/#identity
  attribution: jq 1.8 manual (https://jqlang.org/manual/v1.8/), CC BY 3.0
- id: manual-identity-7
  title: 'Identity: . (7)'
  level: 101
  tags:
  - manual
  program: . as $big | [$big, $big + 1] | map(. > 10000000000000000000000000000000) | . == if have_decnum then [true, false]
    else [false, false] end
  input:
    text: '10000000000000000000000000000001'
  expected:
  - true
  manual:
  - https://jqlang.org/manual/v1.8/#identity
  attribution: jq 1.8 manual (https://jqlang.org/manual/v1.8/), CC BY 3.0
