id: manual-builtin-operators-and-functions
title: 'jq manual: Builtin operators and functions'
description: 'Every runnable example from the ''Builtin operators and functions'' section of the jq 1.8 manual. Source: https://jqlang.org/manual/v1.8/#builtin-operators-and-functions
  (jq 1.8 manual (https://jqlang.org/manual/v1.8/), CC BY 3.0).'
order: 902
track: manual
