# The program the playground suggests when a dataset or snapshot is loaded. Each one runs in
# the test suite against its input like every other piece of content.
starters:
  - ref: static:bookstore
    program: '.store.books[] | select(.price < 10) | {title, price}'
    expected: [{"title": "Learning jq", "price": 8.5}, {"title": "Pipes and Paths", "price": 6.25}]
  - ref: static:github-issues
    program: 'map(select(.state == "open")) | map({number, title, labels: [.labels[].name]})'
    expected: [[{"number": 101, "title": "Crash when input is empty", "labels": ["bug", "priority: high"]}, {"number": 103, "title": "Support @base32d", "labels": ["enhancement"]}, {"number": 105, "title": "Wrong error message for .[] on null", "labels": ["bug"]}, {"number": 107, "title": "Segfault with deeply nested arrays", "labels": ["bug", "priority: high", "needs repro"]}, {"number": 109, "title": "Bump pytest", "labels": ["dependencies"]}, {"number": 110, "title": "Windows line endings in -R mode", "labels": ["bug", "windows"]}]]
