- name: and
  signatures:
  - and
  summary: jq supports the normal Boolean operators `and`, `or`, `not`.
  section: Conditionals and Comparisons
  body: 'jq supports the normal Boolean operators `and`, `or`, `not`.

    They have the same standard of truth as if expressions -

    `false` and `null` are considered "false values", and

    anything else is a "true value".


    If an operand of one of these operators produces multiple

    results, the operator itself will produce a result for each input.


    `not` is in fact a builtin function rather than an operator,

    so it is called as a filter to which things can be piped

    rather than with special syntax, as in `.foo and .bar |

    not`.


    These three only produce the values `true` and `false`, and

    so are only useful for genuine Boolean operations, rather

    than the common Perl/Python/Ruby idiom of

    "value_that_may_be_null or default". If you want to use this

    form of "or", picking between two values rather than

    evaluating a condition, see the `//` operator below.'
  manual: https://jqlang.org/manual/v1.8/#and-or-not
