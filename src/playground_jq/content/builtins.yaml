- name: map
  signatures:
  - map(f)
  summary: For any filter `f`, `map(f)` and `map_values(f)` apply `f` to each of the values in the input array or object,
    that is, to the values of `.[]`.
  section: Builtin operators and functions
  body: "For any filter `f`, `map(f)` and `map_values(f)` apply `f`\nto each of the values in the input array or object, that\
    \ is,\nto the values of `.[]`.\n\nIn the absence of errors, `map(f)` always outputs an array\nwhereas `map_values(f)`\
    \ outputs an array if given an array,\nor an object if given an object.\n\nWhen the input to `map_values(f)` is an object,\
    \ the output\nobject has the same keys as the input object except for\nthose keys whose values when piped to `f` produce\
    \ no values\nat all.\n\nThe key difference between `map(f)` and `map_values(f)` is\nthat the former simply forms an array\
    \ from all the values of\n`($x|f)` for each value, `$x`, in the input array or object,\nbut `map_values(f)` only uses\
    \ `first($x|f)`.\n\nSpecifically, for object inputs, `map_values(f)` constructs\nthe output object by examining in turn\
    \ the value of\n`first(.[$k]|f)` for each key, `$k`, of the input.  If this\nexpression produces no values, then the corresponding\
    \ key\nwill be dropped; otherwise, the output object will have that\nvalue at the key, `$k`.\n\nHere are some examples\
    \ to clarify the behavior of `map` and\n`map_values` when applied to arrays. These examples assume the\ninput is `[1]`\
    \ in all cases:\n\n    map(.+1)          #=>  [2]\n    map(., .)         #=>  [1,1]\n    map(empty)        #=>  []\n\n\
    \    map_values(.+1)   #=>  [2]\n    map_values(., .)  #=>  [1]\n    map_values(empty) #=>  []\n\n`map(f)` is equivalent\
    \ to `[.[] | f]` and\n`map_values(f)` is equivalent to `.[] |= f`.\n\nIn fact, these are their implementations."
  manual: https://jqlang.org/manual/v1.8/#map-map_values
- name: map_values
  signatures:
  - map_values(f)
  summary: For any filter `f`, `map(f)` and `map_values(f)` apply `f` to each of the values in the input array or object,
    that is, to the values of `.[]`.
  section: Builtin operators and functions
  body: "For any filter `f`, `map(f)` and `map_values(f)` apply `f`\nto each of the values in the input array or object, that\
    \ is,\nto the values of `.[]`.\n\nIn the absence of errors, `map(f)` always outputs an array\nwhereas `map_values(f)`\
    \ outputs an array if given an array,\nor an object if given an object.\n\nWhen the input to `map_values(f)` is an object,\
    \ the output\nobject has the same keys as the input object except for\nthose keys whose values when piped to `f` produce\
    \ no values\nat all.\n\nThe key difference between `map(f)` and `map_values(f)` is\nthat the former simply forms an array\
    \ from all the values of\n`($x|f)` for each value, `$x`, in the input array or object,\nbut `map_values(f)` only uses\
    \ `first($x|f)`.\n\nSpecifically, for object inputs, `map_values(f)` constructs\nthe output object by examining in turn\
    \ the value of\n`first(.[$k]|f)` for each key, `$k`, of the input.  If this\nexpression produces no values, then the corresponding\
    \ key\nwill be dropped; otherwise, the output object will have that\nvalue at the key, `$k`.\n\nHere are some examples\
    \ to clarify the behavior of `map` and\n`map_values` when applied to arrays. These examples assume the\ninput is `[1]`\
    \ in all cases:\n\n    map(.+1)          #=>  [2]\n    map(., .)         #=>  [1,1]\n    map(empty)        #=>  []\n\n\
    \    map_values(.+1)   #=>  [2]\n    map_values(., .)  #=>  [1]\n    map_values(empty) #=>  []\n\n`map(f)` is equivalent\
    \ to `[.[] | f]` and\n`map_values(f)` is equivalent to `.[] |= f`.\n\nIn fact, these are their implementations."
  manual: https://jqlang.org/manual/v1.8/#map-map_values
- name: match
  signatures:
  - match(val)
  - match(regex; flags)
  summary: '**match** outputs an object for each match it finds.'
  section: Regular expressions
  body: '**match** outputs an object for each match it finds.  Matches have

    the following fields:


    * `offset` - offset in UTF-8 codepoints from the beginning of the input

    * `length` - length in UTF-8 codepoints of the match

    * `string` - the string that it matched

    * `captures` - an array of objects representing capturing groups.


    Capturing group objects have the following fields:


    * `offset` - offset in UTF-8 codepoints from the beginning of the input

    * `length` - length in UTF-8 codepoints of this capturing group

    * `string` - the string that was captured

    * `name` - the name of the capturing group (or `null` if it was unnamed)


    Capturing groups that did not match anything return an offset of -1'
  manual: https://jqlang.org/manual/v1.8/#match
- name: max
