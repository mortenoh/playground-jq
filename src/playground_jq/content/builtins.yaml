  - paths(node_filter)
  summary: '`paths` outputs the paths to all the elements in its input (except it does not output the empty list, representing
    .'
  section: Builtin operators and functions
  body: '`paths` outputs the paths to all the elements in its input

    (except it does not output the empty list, representing .

    itself).


    `paths(f)` outputs the paths to any values for which `f` is `true`.

    That is, `paths(type == "number")` outputs the paths to all numeric

    values.'
  manual: https://jqlang.org/manual/v1.8/#paths
