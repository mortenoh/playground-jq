- name: range
  signatures:
  - range(upto)
  - range(from; upto)
  - range(from; upto; by)
  summary: The `range` function produces a range of numbers.
  section: Builtin operators and functions
  body: 'The `range` function produces a range of numbers. `range(4; 10)`

    produces 6 numbers, from 4 (inclusive) to 10 (exclusive). The numbers

    are produced as separate outputs. Use `[range(4; 10)]` to get a range as

    an array.


    The one argument form generates numbers from 0 to the given

    number, with an increment of 1.


    The two argument form generates numbers from `from` to `upto`

    with an increment of 1.


    The three argument form generates numbers `from` to `upto`

    with an increment of `by`.'
  manual: https://jqlang.org/manual/v1.8/#range
- name: recurse
  signatures:
  - recurse(f)
  - recurse
  - recurse(f; condition)
  summary: The `recurse(f)` function allows you to search through a recursive structure, and extract interesting data from
    all levels.
  section: Builtin operators and functions
  body: "The `recurse(f)` function allows you to search through a\nrecursive structure, and extract interesting data from\
    \ all\nlevels. Suppose your input represents a filesystem:\n\n    {\"name\": \"/\", \"children\": [\n      {\"name\":\
    \ \"/bin\", \"children\": [\n        {\"name\": \"/bin/ls\", \"children\": []},\n        {\"name\": \"/bin/sh\", \"children\"\
    : []}]},\n      {\"name\": \"/home\", \"children\": [\n        {\"name\": \"/home/stephen\", \"children\": [\n       \
    \   {\"name\": \"/home/stephen/jq\", \"children\": []}]}]}]}\n\nNow suppose you want to extract all of the filenames\n\
    present. You need to retrieve `.name`, `.children[].name`,\n`.children[].children[].name`, and so on. You can do this\n\
    with:\n\n    recurse(.children[]) | .name\n\nWhen called without an argument, `recurse` is equivalent to\n`recurse(.[]?)`.\n\
    \n`recurse(f)` is identical to `recurse(f; true)` and can be\nused without concerns about recursion depth.\n\n`recurse(f;\
    \ condition)` is a generator which begins by\nemitting . and then emits in turn .|f, .|f|f, .|f|f|f, ...  so long\nas\
    \ the computed value satisfies the condition. For example,\nto generate all the integers, at least in principle, one\n\
    could write `recurse(.+1; true)`.\n\nThe recursive calls in `recurse` will not consume additional\nmemory whenever `f`\
    \ produces at most a single output for each\ninput."
  manual: https://jqlang.org/manual/v1.8/#recurse
- name: reduce
  signatures:
  - reduce
  summary: The `reduce` syntax allows you to combine all of the results of an expression by accumulating them into a single
    answer.
  section: Advanced features
  body: "The `reduce` syntax allows you to combine all of the results of\nan expression by accumulating them into a single\
    \ answer.\nThe form is `reduce EXP as $var (INIT; UPDATE)`.\nAs an example, we'll pass `[1,2,3]` to this expression:\n\
    \n    reduce .[] as $item (0; . + $item)\n\nFor each result that `.[]` produces, `. + $item` is run to\naccumulate a running\
    \ total, starting from 0 as the input value.\nIn this example, `.[]` produces the results `1`, `2`, and `3`,\nso the effect\
    \ is similar to running something like this:\n\n    0 | 1 as $item | . + $item |\n        2 as $item | . + $item |\n \
    \       3 as $item | . + $item"
  manual: https://jqlang.org/manual/v1.8/#reduce
