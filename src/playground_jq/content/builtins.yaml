- name: foreach
  signatures:
  - foreach
  summary: The `foreach` syntax is similar to `reduce`, but intended to allow the construction of `limit` and reducers that
    produce intermediate results.
  section: Advanced features
  body: "The `foreach` syntax is similar to `reduce`, but intended to\nallow the construction of `limit` and reducers that\
    \ produce\nintermediate results.\n\nThe form is `foreach EXP as $var (INIT; UPDATE; EXTRACT)`.\nAs an example, we'll pass\
    \ `[1,2,3]` to this expression:\n\n    foreach .[] as $item (0; . + $item; [$item, . * 2])\n\nLike the `reduce` syntax,\
    \ `. + $item` is run for each result\nthat `.[]` produces, but `[$item, . * 2]` is run for each\nintermediate values.\
    \ In this example, since the intermediate\nvalues are `1`, `3`, and `6`, the `foreach` expression produces\n`[1,2]`, `[2,6]`,\
    \ and `[3,12]`. So the effect is similar\nto running something like this:\n\n    0 | 1 as $item | . + $item | [$item,\
    \ . * 2],\n        2 as $item | . + $item | [$item, . * 2],\n        3 as $item | . + $item | [$item, . * 2]\n\nWhen `EXTRACT`\
    \ is omitted, the identity filter is used.\nThat is, it outputs the intermediate values as they are."
  manual: https://jqlang.org/manual/v1.8/#foreach
- name: format
  signatures:
  - format("csv")
  - format("json")
  - format(name)
  summary: The `@foo` syntax is used to format and escape strings, which is useful for building URLs, documents in a language
    like HTML or XML, and so forth.
  section: Builtin operators and functions
  body: "The `@foo` syntax is used to format and escape strings,\nwhich is useful for building URLs, documents in a language\n\
    like HTML or XML, and so forth. `@foo` can be used as a\nfilter on its own, the possible escapings are:\n\n* `@text`:\n\
    \n  Calls `tostring`, see that function for details.\n\n* `@json`:\n\n  Serializes the input as JSON.\n\n* `@html`:\n\n\
    \  Applies HTML/XML escaping, by mapping the characters\n  `<>&'\"` to their entity equivalents `&lt;`, `&gt;`,\n  `&amp;`,\
    \ `&apos;`, `&quot;`.\n\n* `@uri`:\n\n  Applies percent-encoding, by mapping all reserved URI\n  characters to a `%XX`\
    \ sequence.\n\n* `@urid`:\n\n  The inverse of `@uri`, applies percent-decoding, by mapping\n  all `%XX` sequences to their\
    \ corresponding URI characters.\n\n* `@csv`:\n\n  The input must be an array, and it is rendered as CSV\n  with double\
    \ quotes for strings, and quotes escaped by\n  repetition.\n\n* `@tsv`:\n\n  The input must be an array, and it is rendered\
    \ as TSV\n  (tab-separated values). Each input array will be printed as\n  a single line. Fields are separated by a single\n\
    \  tab (ascii `0x09`). Input characters line-feed (ascii `0x0a`),\n  carriage-return (ascii `0x0d`), tab (ascii `0x09`)\
    \ and\n  backslash (ascii `0x5c`) will be output as escape sequences\n  `\\n`, `\\r`, `\\t`, `\\\\` respectively.\n\n\
    * `@sh`:\n\n  The input is escaped suitable for use in a command-line\n  for a POSIX shell. If the input is an array,\
    \ the output\n  will be a series of space-separated strings.\n\n* `@base64`:\n\n  The input is converted to base64 as\
    \ specified by RFC 4648.\n\n* `@base64d`:\n\n  The inverse of `@base64`, input is decoded as specified by RFC 4648.\n\
    \  Note\\: If the decoded string is not UTF-8, the results are undefined.\n\nThis syntax can be combined with string interpolation\
    \ in a\nuseful way. You can follow a `@foo` token with a string\nliteral. The contents of the string literal will *not*\
    \ be\nescaped. However, all interpolations made inside that string\nliteral will be escaped. For instance,\n\n    @uri\
    \ \"https://www.google.com/search?q=\\(.search)\"\n\nwill produce the following output for the input\n`{\"search\":\"\
    what is jq?\"}`:\n\n    \"https://www.google.com/search?q=what%20is%20jq%3F\"\n\nNote that the slashes, question mark,\
    \ etc. in the URL are\nnot escaped, as they were part of the string literal."
  manual: https://jqlang.org/manual/v1.8/#format-strings-and-escaping
