- name: debug
  signatures:
  - debug
  - debug(msgs)
  summary: These two filters are like `.` but have as a side-effect the production of one or more messages on stderr.
  section: I/O
  body: "These two filters are like `.` but have as a side-effect the\nproduction of one or more messages on stderr.\n\nThe\
    \ message produced by the `debug` filter has the form\n\n    [\"DEBUG:\",<input-value>]\n\nwhere `<input-value>` is a\
    \ compact rendition of the input\nvalue.  This format may change in the future.\n\nThe `debug(msgs)` filter is defined\
    \ as `(msgs | debug | empty), .`\nthus allowing great flexibility in the content of the message,\nwhile also allowing\
    \ multi-line debugging statements to be created.\n\nFor example, the expression:\n\n    1 as $x | 2 | debug(\"Entering\
    \ function foo with $x == \\($x)\", .) | (.+1)\n\nwould produce the value 3 but with the following two lines\nbeing written\
    \ to stderr:\n\n    [\"DEBUG:\",\"Entering function foo with $x == 1\"]\n    [\"DEBUG:\",2]"
  manual: https://jqlang.org/manual/v1.8/#debug
