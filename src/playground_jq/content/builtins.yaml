- name: infinite
  signatures:
  - infinite
  summary: Some arithmetic operations can yield infinities and "not a number" (NaN) values.
  section: Builtin operators and functions
  body: 'Some arithmetic operations can yield infinities and "not a

    number" (NaN) values.  The `isinfinite` builtin returns `true`

    if its input is infinite.  The `isnan` builtin returns `true`

    if its input is a NaN.  The `infinite` builtin returns a

    positive infinite value.  The `nan` builtin returns a NaN.

    The `isnormal` builtin returns true if its input is a normal

    number.


    Note that division by zero raises an error.


    Currently most arithmetic operations operating on infinities,

    NaNs, and sub-normals do not raise errors.'
  manual: https://jqlang.org/manual/v1.8/#infinite-nan-isinfinite-isnan-isfinite-isnormal
- name: input
  signatures:
  - input
  summary: Outputs one new input.
  section: I/O
  body: "Outputs one new input.\n\nNote that when using `input` it is generally necessary to\ninvoke jq with the `-n` command-line\
