- name: group_by
  signatures:
  - group_by(path_expression)
  summary: '`group_by(.foo)` takes as input an array, groups the elements having the same `.foo` field into separate arrays,
    and produces all of these arrays as elements of a larger array, sorted by the value of the `.foo` field.'
  section: Builtin operators and functions
  body: '`group_by(.foo)` takes as input an array, groups the

    elements having the same `.foo` field into separate arrays,

    and produces all of these arrays as elements of a larger

    array, sorted by the value of the `.foo` field.


    Any jq expression, not just a field access, may be used in

    place of `.foo`. The sorting order is the same as described

    in the `sort` function above.'
  manual: https://jqlang.org/manual/v1.8/#group_by
- name: gsub
  signatures:
  - gsub(regex; tostring)
  - gsub(regex; tostring; flags)
  summary: '`gsub` is like `sub` but all the non-overlapping occurrences of the regex are replaced by `tostring`, after interpolation.'
  section: Regular expressions
  body: '`gsub` is like `sub` but all the non-overlapping occurrences of the regex are

    replaced by `tostring`, after interpolation. If the second argument is a stream

    of jq strings, then `gsub` will produce a corresponding stream of JSON strings.'
  manual: https://jqlang.org/manual/v1.8/#gsub
- name: halt
  signatures:
  - halt
  summary: Stops the jq program with no further outputs.
  section: Builtin operators and functions
  body: 'Stops the jq program with no further outputs.  jq will exit

    with exit status `0`.'
  manual: https://jqlang.org/manual/v1.8/#halt
- name: halt_error
  signatures:
  - halt_error
  - halt_error(exit_code)
  summary: Stops the jq program with no further outputs.
  section: Builtin operators and functions
  body: 'Stops the jq program with no further outputs.  The input will

    be printed on `stderr` as raw output (i.e., strings will not

    have double quotes) with no decoration, not even a newline.


    The given `exit_code` (defaulting to `5`) will be jq''s exit

    status.


    For example, `"Error: something went wrong\n"|halt_error(1)`.'
  manual: https://jqlang.org/manual/v1.8/#halt_error
