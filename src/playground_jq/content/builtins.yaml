- name: length
  signatures:
  - length
  summary: 'The builtin function `length` gets the length of various different types of value: - The length of a **string**
    is the number of Unicode codepoints it contains (which will be the same as its JSON-encoded length in bytes if it''s pure
    ASCII).'
  section: Builtin operators and functions
  body: "The builtin function `length` gets the length of various\ndifferent types of value:\n\n- The length of a **string**\
    \ is the number of Unicode\n  codepoints it contains (which will be the same as its\n  JSON-encoded length in bytes if\
    \ it's pure ASCII).\n\n- The length of a **number** is its absolute value.\n\n- The length of an **array** is the number\
    \ of elements.\n\n- The length of an **object** is the number of key-value pairs.\n\n- The length of **null** is zero.\n\
    \n- It is an error to use `length` on a **boolean**."
