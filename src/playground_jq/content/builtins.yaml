- name: IN
  signatures:
  - IN(s)
  - IN(source; s)
  summary: This builtin outputs `true` if `.` appears in the given stream, otherwise it outputs `false`.
  section: Builtin operators and functions
  body: "jq provides a few SQL-style operators.\n\n* `INDEX(stream; index_expression)`:\n\n  This builtin produces an object\
    \ whose keys are computed by\n  the given index expression applied to each value from the\n  given stream.\n\n* `JOIN($idx;\
    \ stream; idx_expr; join_expr)`:\n\n  This builtin joins the values from the given stream to the\n  given index.  The\
    \ index's keys are computed by applying the\n  given index expression to each value from the given stream.\n  An array\
    \ of the value in the stream and the corresponding\n  value from the index is fed to the given join expression to\n  produce\
    \ each result.\n\n* `JOIN($idx; stream; idx_expr)`:\n\n  Same as `JOIN($idx; stream; idx_expr; .)`.\n\n* `JOIN($idx; idx_expr)`:\n\
    \n  This builtin joins the input `.` to the given index, applying\n  the given index expression to `.` to compute the\
    \ index key.\n  The join operation is as described above.\n\n* `IN(s)`:\n\n  This builtin outputs `true` if `.` appears\
    \ in the given\n  stream, otherwise it outputs `false`.\n\n* `IN(source; s)`:\n\n  This builtin outputs `true` if any\
    \ value in the source stream\n  appears in the second stream, otherwise it outputs `false`."
  manual: https://jqlang.org/manual/v1.8/#sql-style-operators
