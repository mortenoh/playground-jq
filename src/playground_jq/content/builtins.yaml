  section: Builtin operators and functions
  body: 'The builtin function `has` returns whether the input object

    has the given key, or the input array has an element at the

    given index.


    `has($key)` has the same effect as checking whether `$key`

    is a member of the array returned by `keys`, although `has`

    will be faster.'
  manual: https://jqlang.org/manual/v1.8/#has
