<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>jq playground</title>
        <meta
            name="description"
            content="A playground, language guide, tutorials and example library for learning jq."
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- The palette before the first paint. The names and key are duplicated from src/lib/theme.ts
             on purpose (this runs before any module); src/lib/theme.test.ts checks they agree. -->
        <script>
            ;(function () {
                var known = ['default', 'paper', 'ocean', 'contrast']
                var chosen = 'default'
                try {
                    var stored = localStorage.getItem('pjq.palette')
                    if (known.indexOf(stored) !== -1) chosen = stored
                } catch (denied) {}
                document.documentElement.setAttribute('data-theme', chosen)
            })()
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
